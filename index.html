<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Toolbox</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 600px; margin: 40px auto; padding: 0 20px; background: #fafafa; color: #111; }
        h2 { font-size: 1.2rem; margin-bottom: 16px; }
        input[type="url"] { width: 100%; padding: 12px; font-size: 1rem; box-sizing: border-box; border: 1px solid #ccc; border-radius: 8px; margin-bottom: 12px; }
        .actions { display: flex; gap: 10px; margin-bottom: 20px; }
        button { flex: 1; padding: 12px; font-size: 0.95rem; font-weight: 500; border: none; border-radius: 8px; background: #111; color: #fff; cursor: pointer; }
        button:active { background: #444; }
        pre { background: #fff; border: 1px solid #ddd; padding: 16px; border-radius: 8px; white-space: pre-wrap; word-break: break-word; font-size: 0.85rem; max-height: 400px; overflow-y: auto; }
    </style>
</head>
<body>

    <h2>Web & Archive Toolbox</h2>
    <input type="url" id="targetUrl" placeholder="Paste target URL here..." />
    
    <div class="actions">
        <button onclick="archivePage()">Archive (Wayback)</button>
        <button onclick="cleanRead()">Clean Read</button>
    </div>

    <pre id="output">Results will appear here...</pre>

    <script>
        async function archivePage() {
            const url = document.getElementById('targetUrl').value.trim();
            const output = document.getElementById('output');
            if (!url) { output.textContent = "Please enter a valid URL first."; return; }
            
            output.textContent = "Submitting to Wayback Machine...";
            try {
                const response = await fetch(`https://web.archive.org/save/${encodeURIComponent(url)}`, {
                    method: 'GET'
                });
                if (response.ok) {
                    output.textContent = `Successfully archived!\nChecked URL: https://web.archive.org/web/*/${url}`;
                } else {
                    output.textContent = `Archive request sent, status code: ${response.status}`;
                }
            } catch (err) {
                output.textContent = `Error: ${err.message}`;
            }
        }

        async function cleanRead() {
            const url = document.getElementById('targetUrl').value.trim();
            const output = document.getElementById('output');
            if (!url) { output.textContent = "Please enter a valid URL first."; return; }

            output.textContent = "Fetching content...";
            try {
                const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(url)}`;
                const response = await fetch(proxyUrl);
                const data = await response.json();
                
                if (data.contents) {
                    const parser = new DOMParser();
                    const doc = parser.parseFromString(data.contents, 'text/html');
                    
                    ['script', 'style', 'nav', 'footer', 'header'].forEach(tag => {
                        doc.querySelectorAll(tag).forEach(el => el.remove());
                    });

                    const text = doc.body.innerText || doc.body.textContent;
                    output.textContent = text.substring(0, 3500) + "\n\n[Content truncated for readability]";
                } else {
                    output.textContent = "Could not retrieve page content.";
                }
            } catch (err) {
                output.textContent = `Fetch error: ${err.message}`;
            }
        }
    </script>
</body>
</html>
