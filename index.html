<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web & Archive Toolbox</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            max-width: 680px;
            margin: 40px auto;
            padding: 0 20px;
            background: #fafafa;
            color: #111;
            line-height: 1.5;
        }
        h2 {
            font-size: 1.25rem;
            margin-bottom: 16px;
            font-weight: 600;
        }
        input[type="url"] {
            width: 100%;
            padding: 12px;
            font-size: 1rem;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 8px;
            margin-bottom: 12px;
            background: #fff;
        }
        .actions {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        button {
            flex: 1;
            padding: 12px;
            font-size: 0.95rem;
            font-weight: 500;
            border: none;
            border-radius: 8px;
            background: #111;
            color: #fff;
            cursor: pointer;
            transition: background 0.15s ease;
        }
        button:hover {
            background: #333;
        }
        button:active {
            background: #555;
        }
        #output {
            background: #fff;
            border: 1px solid #ddd;
            padding: 20px;
            border-radius: 8px;
            white-space: pre-wrap;
            word-break: break-word;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-size: 0.95rem;
            line-height: 1.65;
            max-height: 550px;
            overflow-y: auto;
        }
        a {
            color: #0066cc;
            word-break: break-all;
        }
    </style>
</head>
<body>

    <h2>Web & Archive Toolbox</h2>
    <input type="url" id="targetUrl" placeholder="Paste target URL here..." />
    
    <div class="actions">
        <button onclick="archivePage()">Archive (Wayback)</button>
        <button onclick="cleanRead()">Clean Read</button>
    </div>

    <div id="output">Results will appear here...</div>

    <script>
        async function archivePage() {
            const url = document.getElementById('targetUrl').value.trim();
            const output = document.getElementById('output');
            if (!url) {
                output.textContent = "Please enter a valid URL first.";
                return;
            }
            
            output.textContent = "Submitting to Wayback Machine...";
            try {
                // Using no-cors mode because Wayback Machine's save endpoint doesn't send CORS headers to browsers,
                // though it still processes the GET request on their servers.
                await fetch(`https://web.archive.org/save/${encodeURIComponent(url)}`, {
                    method: 'GET',
                    mode: 'no-cors'
                });
                
                const archiveLookup = `https://web.archive.org/web/*/${url}`;
                output.innerHTML = `Archive request sent to the Wayback Machine.<br><br>Check snapshot status here:<br><a href="${archiveLookup}" target="_blank" rel="noopener noreferrer">${archiveLookup}</a>`;
            } catch (err) {
                output.textContent = `Archive request error: ${err.message}`;
            }
        }

        async function cleanRead() {
            const url = document.getElementById('targetUrl').value.trim();
            const output = document.getElementById('output');
            if (!url) {
                output.textContent = "Please enter a valid URL first.";
                return;
            }

            output.textContent = "Fetching content through proxy...";
            try {
                const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(url)}`;
                const response = await fetch(proxyUrl);
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const data = await response.json();
                
                if (data.contents) {
                    const parser = new DOMParser();
                    const doc = parser.parseFromString(data.contents, 'text/html');
                    
                    // Remove non-article clutter elements
                    ['script', 'style', 'nav', 'footer', 'header', 'aside', 'iframe', 'noscript'].forEach(tag => {
                        doc.querySelectorAll(tag).forEach(el => el.remove());
                    });

                    // Try to target the main article container first for cleaner output
                    const mainContent = doc.querySelector('article') || doc.querySelector('main') || doc.body;
                    const rawText = mainContent.innerText || mainContent.textContent || "";
                    
                    // Collapse excessive blank lines
                    const cleanedText = rawText.replace(/\n\s*\n/g, '\n\n').trim();
                    
                    if (cleanedText) {
                        output.textContent = cleanedText.substring(0, 8000) + (cleanedText.length > 8000 ? "\n\n[Truncated at 8,000 characters]" : "");
                    } else {
                        output.textContent = "Page loaded, but no readable text could be extracted.";
                    }
                } else {
                    output.textContent = "Could not retrieve page content through proxy.";
                }
            } catch (err) {
                output.textContent = `Fetch error: ${err.message}\n\nNote: Sites with strict anti-bot firewalls (like Cloudflare) or public proxy downtime can block browser proxy fetches.`;
            }
        }
    </script>
</body>
</html>
