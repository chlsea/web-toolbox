<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web & Archive Toolbox</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            max-width: 600px;
            margin: 60px auto;
            padding: 0 20px;
            background: #fafafa;
            color: #111;
        }
        h2 { font-size: 1.2rem; margin-bottom: 16px; }
        input[type="url"] {
            width: 100%;
            padding: 14px;
            font-size: 1rem;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 8px;
            margin-bottom: 16px;
            background: #fff;
        }
        .actions {
            display: flex;
            gap: 12px;
        }
        button {
            flex: 1;
            padding: 14px;
            font-size: 0.95rem;
            font-weight: 500;
            border: none;
            border-radius: 8px;
            background: #111;
            color: #fff;
            cursor: pointer;
        }
        button:hover { background: #333; }
    </style>
</head>
<body>

    <h2>Web & Archive Toolbox</h2>
    <input type="url" id="targetUrl" placeholder="Paste target URL here..." autofocus />
    
    <div class="actions">
        <button onclick="openArchive()">Archive (Wayback)</button>
        <button onclick="openCleanRead()">Clean Read</button>
    </div>

    <script>
        function openArchive() {
            const url = document.getElementById('targetUrl').value.trim();
            if (!url) { alert("Please enter a valid URL first."); return; }
            // Triggers Wayback Machine save directly
            window.open(`https://web.archive.org/save/${url}`, '_blank');
        }

        function openCleanRead() {
            const url = document.getElementById('targetUrl').value.trim();
            if (!url) { alert("Please enter a valid URL first."); return; }
            // Routes through an instant text/reader extractor gateway
            window.open(`https://r.jina.ai/${url}`, '_blank');
        }
    </script>
</body>
</html>
